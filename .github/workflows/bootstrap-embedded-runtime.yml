name: Bootstrap embedded Moataz Runtime

on:
  push:
    branches: [codex/embed-moataz-runtime]
    paths: [.github/workflows/bootstrap-embedded-runtime.yml]

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/embed-moataz-runtime
      - name: Install ARM64 runtime builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support jq xz-utils
          sudo update-binfmts --enable qemu-aarch64
          test -x /usr/bin/qemu-aarch64-static
      - name: Build and probe Debian 13 with OpenCode
        env:
          # Pinned and verified against the release asset digest by the builder.
          OPENCODE_VERSION: 1.18.19
        run: scripts/build_embedded_runtime.sh
      - name: Publish generated runtime parts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u -- androidApp/src/main/assets/moataz-debian-rootfs-arm64.tar.xz
          git add -- androidApp/src/main/assets/moataz-debian-rootfs-arm64.manifest.json
          git add -- androidApp/src/main/assets/moataz-debian-rootfs-arm64.tar.xz.part-*
          git rm .github/workflows/bootstrap-embedded-runtime.yml
          git commit -m "chore(runtime): embed Debian tools and OpenCode"
          git push origin HEAD:codex/embed-moataz-runtime
