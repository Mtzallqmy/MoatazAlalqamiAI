name: Bootstrap verified Debian 13 rootfs
on:
  push:
    branches:
      - codex/moataz-product-foundation
    paths:
      - .github/workflows/bootstrap-moataz-rootfs.yml
permissions:
  contents: write
jobs:
  publish-rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/moataz-product-foundation
      - name: Download and verify rootfs
        shell: bash
        run: |
          set -euo pipefail
          target=androidApp/src/main/assets/moataz-debian-rootfs-arm64.tar.xz
          curl --fail --location --retry 3 --connect-timeout 30 \
            'https://images.linuxcontainers.org/images/debian/trixie/arm64/default/20260820_05:24/rootfs.tar.xz' \
            --output "$target"
          echo 'f57c832becb6af542e5ebe2d8cd2add5b032528131b5b8614e3ec3c68051d7e4  '"$target" | sha256sum --check -
          python3 scripts/verify_rootfs.py "$target" androidApp/src/main/assets/moataz-debian-rootfs-arm64.manifest.json
      - name: Publish asset and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- androidApp/src/main/assets/moataz-debian-rootfs-arm64.tar.xz
          git rm -- .github/workflows/bootstrap-moataz-rootfs.yml
          git commit -m 'chore(runtime): publish verified Debian 13 rootfs'
          git push origin HEAD:codex/moataz-product-foundation
