name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build & Test
        run: |
          python3 scripts/verify_rootfs.py \
            androidApp/src/main/assets \
            androidApp/src/main/assets/moataz-debian-rootfs-arm64.manifest.json
          ./gradlew :composeApp:testAndroid --no-daemon
          ./gradlew :androidApp:assembleFossDebug --no-daemon
          ./gradlew :androidApp:assembleFossRelease --no-daemon
      - name: Verify arm64 APK contract
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          APK="$(find androidApp/build/outputs/apk/foss/release -name '*.apk' | head -1)"
          test -n "$APK"
          zipinfo -1 "$APK" | grep '^lib/arm64-v8a/libproot.so$'
          zipinfo -1 "$APK" | grep '^lib/arm64-v8a/libproot-loader.so$'
          zipinfo -1 "$APK" | grep '^lib/arm64-v8a/libtalloc.so$'
          ! zipinfo -1 "$APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'
          zipinfo -1 "$APK" | grep 'assets/moataz-debian-rootfs-arm64.tar.xz.part-'
          zipinfo -1 "$APK" | grep 'assets/moataz-debian-rootfs-arm64.manifest.json$'
          "$AAPT" dump badging "$APK" | grep -E "versionCode='[1-9][0-9]*'"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/release-certs.txt 2>&1 || true
          ! grep -q 'Android Debug' /tmp/release-certs.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-debug
          path: androidApp/build/outputs/apk/foss/debug/*.apk
