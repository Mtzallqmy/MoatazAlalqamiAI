name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create CI release-signing identity
        # Ephemeral validation key: proves the release variant is actually signed,
        # but is never uploaded or used as the production distribution identity.
        run: |
          CI_KEYSTORE="$RUNNER_TEMP/moataz-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$CI_KEYSTORE" \
            -storepass moataz-ci-validation \
            -keypass moataz-ci-validation \
            -alias moataz-ci-release \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Moataz CI Release, O=Moataz CI, C=YE"
          echo "KEYSTORE_FILE=$CI_KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=moataz-ci-validation" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=moataz-ci-release" >> "$GITHUB_ENV"
      - name: Test rootfs verifier
        run: python3 -m unittest scripts.test_verify_rootfs --verbose
      - name: Build & Test
        run: |
          python3 scripts/verify_rootfs.py \
            androidApp/src/full/assets \
            androidApp/src/full/assets/moataz-debian-rootfs-arm64.manifest.json
          ./gradlew :composeApp:testAndroid :sandbox-gateway:test --no-daemon
          ./gradlew \
            :androidApp:assembleFossFullDebug \
            :androidApp:assembleFossFullRelease \
            :androidApp:assembleFossLiteDebug \
            :androidApp:assembleFossLiteRelease \
            --no-daemon
          # Backward-compatible entry points must continue resolving to Full.
          ./gradlew :androidApp:assembleFossDebug --no-daemon
          ./gradlew :androidApp:assembleFossRelease --no-daemon
      - name: Verify Full and Lite APK contracts
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          FULL_APK="$(find androidApp/build/outputs/apk -type f -name '*.apk' | grep -E '/fossFull/release/|/foss/full/release/' | head -1)"
          LITE_APK="$(find androidApp/build/outputs/apk -type f -name '*.apk' | grep -E '/fossLite/release/|/foss/lite/release/' | head -1)"
          test -n "$FULL_APK"
          test -n "$LITE_APK"
          for APK in "$FULL_APK" "$LITE_APK"; do
            zipinfo -1 "$APK" | grep '^lib/arm64-v8a/libproot.so$'
            zipinfo -1 "$APK" | grep '^lib/arm64-v8a/libproot-loader.so$'
            zipinfo -1 "$APK" | grep '^lib/arm64-v8a/libtalloc.so$'
            ! zipinfo -1 "$APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'
            PACKAGE_INFO="$("$AAPT" dump badging "$APK" | grep '^package:')"
            printf '%s\n' "$PACKAGE_INFO" | grep -E "^package: name='com\.inspiredandroid\.kai' "
            printf '%s\n' "$PACKAGE_INFO" | grep -E "versionCode='[1-9][0-9]*'"
            CERTS="$RUNNER_TEMP/$(basename "$APK").certs.txt"
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "$CERTS"
            cat "$CERTS"
            grep -Eq '^(V[0-9]+ Signer|Signer #[0-9]+).*certificate DN:' "$CERTS"
            grep -q 'CN=Moataz CI Release' "$CERTS"
            ! grep -qi 'Android Debug' "$CERTS"
          done
          zipinfo -1 "$FULL_APK" | grep 'assets/moataz-debian-rootfs-arm64.tar.xz.part-'
          zipinfo -1 "$FULL_APK" | grep 'assets/moataz-debian-rootfs-arm64.manifest.json$'
          ! zipinfo -1 "$LITE_APK" | grep 'assets/moataz-debian-rootfs-arm64.tar.xz.part-'
          ! zipinfo -1 "$LITE_APK" | grep 'assets/moataz-debian-rootfs-arm64.manifest.json$'
      - name: Upload Full and Lite APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-full-lite-debug
          path: |
            androidApp/build/outputs/apk/fossFull/debug/*.apk
            androidApp/build/outputs/apk/fossLite/debug/*.apk
            androidApp/build/outputs/apk/foss/full/debug/*.apk
            androidApp/build/outputs/apk/foss/lite/debug/*.apk
