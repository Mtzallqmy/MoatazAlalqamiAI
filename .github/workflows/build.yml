name: Build & Test

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK
        run: yes | sdkmanager "ndk;29.0.14206865"

      - name: Test and compile debug + release
        run: |
          ./gradlew :composeApp:testAndroid --no-daemon --stacktrace
          ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace
          ./gradlew :androidApp:assembleFossRelease --no-daemon --stacktrace

      - name: Verify arm64 native packaging
        run: |
          set -euo pipefail
          for apk in $(find androidApp/build/outputs/apk/foss -type f -name '*.apk'); do
            unzip -Z1 "$apk" | grep '^lib/arm64-v8a/libproot.so$'
            unzip -Z1 "$apk" | grep '^lib/arm64-v8a/libproot-loader.so$'
            unzip -Z1 "$apk" | grep '^lib/arm64-v8a/libtalloc.so$'
            if unzip -Z1 "$apk" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
              echo "Unexpected non-arm64 native library in $apk" >&2
              exit 1
            fi
          done

      - name: Upload build APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-arm64-ci
          path: androidApp/build/outputs/apk/foss/**/*.apk
          if-no-files-found: error
